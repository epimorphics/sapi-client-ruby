name: Rubocop checking

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3
    - name: Install dependencies (bundle)
      run: bundle install
    - name: Run Rubocop
      run: bundle exec rubocop
