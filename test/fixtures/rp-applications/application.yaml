spring:
  application:
    name: fsa-rpa-api
sapi-nt:
  api:
    name: ${spring.application.name}
    baseURI: http://data.food.gov.uk/regulated-product-applications
    title: Regulated Products Applications API
    publisher: Food Standards Agency
    licenceName: OGL 3
    licenceURI: http://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
    version: 1.0.1
  config:
    loadSpecPath: "classpath:endpointSpecs"
    docSpecPath: "classpath:documentation"
    defaultItemTemplate: item
    defaultListTemplate: list
    maxAge: 1200
    negotiation:
      path:
        ignoreUnknownExtensions: true
  health:
    enabled: true
  web:
    controller:
      default:
        enabled: false
      doc:
        enabled: true
server:
  servlet:
    contextPath: /regulated-product-applications
  datasource:
    endpoint: http://localhost:3030/ds/query
management:
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true